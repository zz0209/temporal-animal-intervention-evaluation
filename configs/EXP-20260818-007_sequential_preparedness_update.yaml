experiment:
  id: EXP-20260818-007
  name: sequential_preparedness_update
  evidence_level: preregistered_two_stage_resource_matched_policy_gate
  description: Test whether outbreak evidence improves a second intervention tranche after immediate history-based preparedness, without delaying the first action.

data:
  stable_prediction_path: results/EXP-20260816-006/full/forward_predictions.csv
  prerequisite_audit: results/EXP-20260818-006/full/audit.json
  datasets:
    oxford_wildbird_network:
      source_config: configs/EXP-20260814-003_oxford_predefense.yaml
      source_results: results/EXP-20260814-003/full
      network_id: all
      system_family: oxford_wildbird_network
      analysis_cluster: anchor
    guinea_baboons_sociopatterns:
      source_config: configs/EXP-20260814-004_baboon_validation.yaml
      source_results: results/EXP-20260814-004/full
      network_id: all
      system_family: guinea_baboons_sociopatterns
      analysis_cluster: anchor
    domestic_sheep_sirtrack:
      source_config: configs/EXP-20260815-009_sheep_precision_repaired.yaml
      source_results: results/EXP-20260815-009/full
      system_family: domestic_sheep_sirtrack
      analysis_cluster: network
    wytham_great_tits_divorce:
      source_config: configs/EXP-20260815-007_wytham_precision_repaired.yaml
      source_results: results/EXP-20260815-007/full
      system_family: linked_wytham_songbird_family
      analysis_cluster: anchor
    radolfzell_great_tits_ontogeny:
      source_config: configs/EXP-20260815-011_radolfzell_validation.yaml
      source_results: results/EXP-20260815-011/full
      network_id: radolfzell_longitudinal_population
      system_family: radolfzell_great_tits_ontogeny
      analysis_cluster: anchor
    experimental_wild_songbirds:
      source_config: configs/EXP-20260816-001_experimental_songbirds_validation.yaml
      source_results: results/EXP-20260816-001/full
      network_id: wytham_songbird_manipulation_population
      system_family: linked_wytham_songbird_family
      analysis_cluster: anchor

decision:
  policies:
    - case_only
    - early_history
    - two_stage_history
    - two_stage_reactive
    - history_upfront
  minimum_tranche_budget: 1
  tranche_budget_fraction: 0.05
  tracing_half_life_fraction_of_mean_infectious_period: 0.5
  secondary_case_sensitivity: 0.5
  false_positive_rate: 0.0
  action_delay_fraction_of_mean_infectious_period: 0.1
  residual_contact_multiplier: 0.25
  rewiring_fraction: 0.0
  early_detection_fraction: 0.25
  update_detection_fraction: 0.55
  epidemic_models:
    - name: temporal_sir
    - name: temporal_seir_erlang
      latent_period_fraction_of_mean_infectious_period: 0.5
      latent_stages: 2
      infectious_stages: 3

evaluation:
  parameter_pool: informative
  parameter_selection_mode: median
  independent_replication_unit: animal_system_family
  bootstrap_replicates: 4000
  deletion_bootstrap_replicates: 2000
  seed: 2026081807
  contrasts:
    preparedness_absolute: case_only final size minus early_history final size
    second_history_value: early_history final size minus two_stage_history final size
    second_reactive_value: early_history final size minus two_stage_reactive final size
    update_information_gain: two_stage_history final size minus two_stage_reactive final size
    staged_history_cost: two_stage_history final size minus history_upfront final size
    sequential_recovery: history_upfront final size minus two_stage_reactive final size
  primary_gate:
    metric: update_information_gain
    rule: interval lower bound positive and at least four of five family means positive
  recovery_gate:
    metric: sequential_recovery
    rule: interval lower bound nonnegative and at least four of five family means nonnegative
  absolute_safety_gate:
    metric: second_reactive_value
    rule: interval lower bound positive and at least four of five family means positive
  multiplicity: update_information_gain is primary; sequential_recovery and absolute safety are required co-gates; other contrasts are explanatory
  stop_rule: do not tune update time, tranche size, disease parameters, or policy definitions after full results

profiles:
  smoke:
    datasets: [oxford_wildbird_network, domestic_sheep_sirtrack, wytham_great_tits_divorce, radolfzell_great_tits_ontogeny]
    max_anchors_per_dataset: 1
    seeds_per_anchor: 1
    random_blocks: 1
    bootstrap_replicates: 100
    deletion_bootstrap_replicates: 50
    render_dpi: 110
  full:
    datasets:
      - oxford_wildbird_network
      - guinea_baboons_sociopatterns
      - domestic_sheep_sirtrack
      - wytham_great_tits_divorce
      - radolfzell_great_tits_ontogeny
      - experimental_wild_songbirds
    max_anchors_per_dataset: null
    seeds_per_anchor: 2
    random_blocks: 2
    render_dpi: 180

execution:
  resume: true

outputs:
  results_root: results
  report_root: reports/sequential_policy
