experiment:
  id: EXP-20260819-007
  name: random_target_distribution
  evidence_level: frozen_precision_replication_of_exp_20260819_005
  description: Estimate history-targeting value against a distribution of independently sampled equal-capacity random response lists.

data:
  source_role_config: configs/EXP-20260818-008_role_aware_sentinel_response.yaml
  source_policy_worlds: results/EXP-20260818-008/full/policy_worlds.csv.gz
  stable_prediction_path: results/EXP-20260816-006/full/forward_predictions.csv
  datasets:
    oxford_wildbird_network:
      source_config: configs/EXP-20260814-003_oxford_predefense.yaml
      source_results: results/EXP-20260814-003/full
      network_id: all
      system_family: oxford_wildbird_network
      analysis_cluster: anchor
    guinea_baboons_sociopatterns:
      source_config: configs/EXP-20260814-004_baboon_validation.yaml
      source_results: results/EXP-20260814-004/full
      network_id: all
      system_family: guinea_baboons_sociopatterns
      analysis_cluster: anchor
    domestic_sheep_sirtrack:
      source_config: configs/EXP-20260815-009_sheep_precision_repaired.yaml
      source_results: results/EXP-20260815-009/full
      system_family: domestic_sheep_sirtrack
      analysis_cluster: network
    wytham_great_tits_divorce:
      source_config: configs/EXP-20260815-007_wytham_precision_repaired.yaml
      source_results: results/EXP-20260815-007/full
      system_family: linked_wytham_songbird_family
      analysis_cluster: anchor
    radolfzell_great_tits_ontogeny:
      source_config: configs/EXP-20260815-011_radolfzell_validation.yaml
      source_results: results/EXP-20260815-011/full
      network_id: radolfzell_longitudinal_population
      system_family: radolfzell_great_tits_ontogeny
      analysis_cluster: anchor
    experimental_wild_songbirds:
      source_config: configs/EXP-20260816-001_experimental_songbirds_validation.yaml
      source_results: results/EXP-20260816-001/full
      network_id: wytham_songbird_manipulation_population
      system_family: linked_wytham_songbird_family
      analysis_cluster: anchor

decision:
  sentinel_method: history_coverage
  response_methods: [case_only, random, history_weight]
  sentinel_budget_fraction: 0.05
  response_budget_fraction: 0.05
  minimum_budget: 1
  action_delay_fraction_of_mean_infectious_period: 0.1
  residual_contact_multiplier: 0.25
  early_detection_threshold_fraction: 0.10
  epidemic_models:
    - name: temporal_sir
    - name: temporal_seir_erlang
      latent_period_fraction_of_mean_infectious_period: 0.5
      latent_stages: 2
      infectious_stages: 3

evaluation:
  parameter_pool: informative
  parameter_selection_mode: median
  independent_replication_unit: animal_system_family
  bootstrap_replicates: 4000
  deletion_bootstrap_replicates: 2000
  seed: 2026081808
  primary_estimand: mean final attack rate over eight independent random response lists minus history-ranked final attack rate in the identical epidemic world
  random_distribution_estimand: midrank percentile of history-ranked final size among eight equal-capacity random response lists, where larger percentiles favor history
  interpretation: EXP-20260819-005 remains the original matched-capacity result; this run estimates comparator-distribution uncertainty without changing policy or disease settings
  primary_gate:
    strong: targeting-increment interval lower bound is positive and at least four of five family means are positive in both epidemic models
    directional: targeting-increment mean is positive and at least four of five family means are positive in both epidemic models
    unsupported: otherwise
  stop_rule: no tuning of budgets, disease parameters, sentinel method, target score, target replicate count, delay, residual contact, or gate after full results

profiles:
  smoke:
    datasets: [oxford_wildbird_network, domestic_sheep_sirtrack]
    max_anchors_per_dataset: 1
    seeds_per_anchor: 1
    random_blocks: 1
    random_target_replicates: 2
    bootstrap_replicates: 100
    deletion_bootstrap_replicates: 50
    render_dpi: 110
  full:
    datasets:
      - oxford_wildbird_network
      - guinea_baboons_sociopatterns
      - domestic_sheep_sirtrack
      - wytham_great_tits_divorce
      - radolfzell_great_tits_ontogeny
      - experimental_wild_songbirds
    max_anchors_per_dataset: null
    seeds_per_anchor: 2
    random_blocks: 2
    random_target_replicates: 8
    render_dpi: 180

execution:
  resume: true

outputs:
  results_root: results
  report_root: reports/random_target_distribution
