claim_ledger:
  - claim_id: C1_temporal_order
    claim: Tested temporal-order centralities do not show a robust increment over matched static summaries.
    status: supported_null_within_tested_methods
    source_experiments: EXP-20260816-005
    transportability: five_family_hierarchical
    field_validity: model_based_labels
  - claim_id: C2_learned_planners
    claim: Ridge, Deep Sets, pairwise ranking, and selective learned overrides do not outperform the transparent reference under strict held-out-family evaluation.
    status: supported_negative_result
    source_experiments: EXP-20260816-014|EXP-20260816-015|EXP-20260816-016
    transportability: four_family_loso
    field_validity: model_based_set_values
  - claim_id: C3_preparedness_reference
    claim: History weight is the defensible preparedness reference; the simulation-derived stable watchlist is not superior to closest history comparators.
    status: supported_baseline_revision
    source_experiments: EXP-20260817-005
    transportability: five_family_hierarchical
    field_validity: model_based_counterfactual
  - claim_id: C4_conditional_update
    claim: Detected-case contact updates have pooled conditional value under delayed staged SEIR/Erlang assumptions but are not whole-family-deletion robust.
    status: conditionally_supported_not_transportable
    source_experiments: EXP-20260817-006|EXP-20260817-007
    transportability: deletion_gate_failed
    field_validity: model_based_counterfactual
  - claim_id: C5_dual_safety
    claim: Relative policy improvement cannot replace an absolute comparison with no additional targeting; unresolved cells require abstention.
    status: supported_decision_principle
    source_experiments: EXP-20260817-006|EXP-20260817-008
    transportability: three_abstentions_deletion_invariant
    field_validity: model_based_counterfactual
  - claim_id: C6_universal_policy
    claim: A universal cross-animal-system policy winner is not supported.
    status: supported_rejection
    source_experiments: EXP-20260817-007|EXP-20260817-008
    transportability: direct_test
    field_validity: five_empirical_system_families
  - claim_id: C7_field_effectiveness
    claim: Field effectiveness for a named pathogen or population is established.
    status: not_supported_and_excluded
    source_experiments: none
    transportability: not_applicable
    field_validity: no_observed_outbreak_outcomes
  - claim_id: C8_source_vs_intervention
    claim: Index-case source impact is strongly associated with, but is not interchangeable with, prospective intervention value; first appearance and observation support must remain explicit covariates and eligibility diagnostics.
    status: supported_distinction_and_support_audit
    source_experiments: EXP-20260818-001
    transportability: five_family_hierarchical
    field_validity: model_based_counterfactual

