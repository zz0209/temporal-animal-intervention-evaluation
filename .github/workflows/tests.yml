name: tests

on:
  push:
  pull_request:

jobs:
  contract-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install locked environment
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-build-isolation
      - name: Run data-independent contract suite
        shell: pwsh
        run: |
          python -m pytest -q `
            tests/test_contract_validation.py `
            tests/test_mappers.py `
            tests/test_network_views.py `
            tests/test_temporal_sir.py `
            tests/test_seir_simulation.py `
            tests/test_paired_simulation.py `
            tests/test_intervention_value.py `
            tests/test_label_contract.py `
            tests/test_submission_rebuild.py
