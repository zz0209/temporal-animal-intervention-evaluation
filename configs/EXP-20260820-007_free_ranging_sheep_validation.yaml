experiment:
  id: EXP-20260820-007
  name: free_ranging_sheep_prospective_validation
  evidence_level: independent_animal_system_validation
  description: Prospective singleton-intervention labels from continuous fission-fusion group partitions.

data:
  dataset_id: free_ranging_sheep_fission_fusion
  display_name: Free-ranging sheep
  canonical_path: data/free_ranging_sheep_fission_fusion/processed
  primary_modality: author_inferred_spatial_groups
  mapper: frequency_dependent_group_mixing
  group_mixing_mode: frequency_dependent

windows:
  lookback: 24h
  horizon: 24h
  step: 12h
  min_history_events_per_node: 10
  max_anchors: 6

parameter_grid:
  beta_values: [0.00003, 0.00005, 0.000075, 0.0001]
  beta_unit: per_second_of_frequency_dependent_group_coattendance
  mean_infectious_period_days: [0.5, 1.0, 2.0]
  major_outbreak_attack_rate: 0.20
  informative_mean_attack_rate_lower: 0.05
  informative_mean_attack_rate_upper: 0.80
  informative_major_outbreak_probability_lower: 0.05
  informative_major_outbreak_probability_upper: 0.95
  max_selected_scenarios: 3
  required_reference:
    beta: 0.00005
    mean_infectious_period_days: 1.0

intervention:
  name: complete_contact_isolation
  action_type: isolation
  delay: 0s
  duration: 24h
  contact_multiplier: 0.0
  susceptibility_multiplier: 1.0
  infectivity_multiplier: 1.0
  recovery_rate_multiplier: 1.0

stability:
  top_k: 10
  consensus_minimum_contexts: 3
  gates:
    minimum_selected_scenarios: 3
    minimum_informative_selected_scenarios: 3
    aggregate_label_reliability: 0.70
    parameter_median_spearman: 0.50
    aggregate_label_candidate_separation_icc: 0.40

execution:
  runner: checkpointed_process_pool

profiles:
  smoke:
    candidate_limit: 8
    max_anchors: 2
    calibration_parameter_limit: null
    calibration_index_limit: 6
    calibration_replicates_per_index: 1
    selected_scenario_limit: 3
    random_blocks: 2
    non_index_cases_per_candidate_block: 2
    self_index_replicates_per_block: 1
    max_workers: 2
    seed: 2026082007
  full:
    candidate_limit: null
    max_anchors: 6
    calibration_parameter_limit: null
    calibration_index_limit: 12
    calibration_replicates_per_index: 1
    selected_scenario_limit: 3
    random_blocks: 3
    non_index_cases_per_candidate_block: 8
    self_index_replicates_per_block: 1
    max_workers: 9
    seed: 2026082007

report:
  history_label: 24 hours within one continuous recording segment
  forecast_label: 24 held-out hours in the same segment
  population_noun: sheep
  observation_design:
    - The source study followed one independently sampled free-ranging flock.
    - Group partitions use the authors' primary 30 m near and 50 m sticky radii.
    - Consecutive identical partitions are represented as lossless intervals.
    - Three recording gaps remain explicit and no window crosses a gap.

outputs:
  results_root: results
  report_root: reports/g1_sim
