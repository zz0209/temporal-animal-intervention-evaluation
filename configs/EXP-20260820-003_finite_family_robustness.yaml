experiment:
  id: EXP-20260820-003
  name: finite_family_robustness
  evidence_level: reviewer_requested_frozen_result_reanalysis
  description: Stress-test headline contrasts without changing any simulator or policy parameter.

data:
  individual_differences: results/EXP-20260816-006/full/strategy_differences.csv
  case_worlds: results/EXP-20260819-012/full/policy_worlds.csv.gz
  case_contrasts: results/EXP-20260819-012/full/paired_decomposition.csv.gz
  forecast_contrasts: results/EXP-20260820-002/full/heldout_contrasts.csv.gz

analysis:
  individual_comparison: stable_over_random
  individual_outcomes:
    - spearman_gain
    - value_capture_gain
  case_contrast: recent_ring_vs_random
  forecast_contrast: forecast_oracle_vs_history
  forecast_model: temporal_seir_erlang
  tie_credit: 0.5

outputs:
  results_root: results
  report_root: reports/finite_family_robustness
  manuscript_figure_path: paper/figures/FigS1.png
