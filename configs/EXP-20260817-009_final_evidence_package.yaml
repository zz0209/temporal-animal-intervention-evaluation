experiment:
  id: EXP-20260817-009
  name: final_frozen_evidence_package
  evidence_level: reconstruction_and_claim_audit
  description: Reconstruct manuscript-facing tables and comparison coverage from frozen source artifacts without new simulation or policy tuning.

