experiment:
  id: EXP-20260819-011
  name: diversity_aware_immediate_response
  evidence_level: frozen_history_only_set_redundancy_test
  description: Test whether a transparent history-only facility-location selector closes the singleton prediction-to-set-policy gap without using future contacts or epidemic outcomes.

data:
  stable_prediction_path: results/EXP-20260816-006/full/forward_predictions.csv
  datasets:
    oxford_wildbird_network:
      source_config: configs/EXP-20260814-003_oxford_predefense.yaml
      source_results: results/EXP-20260814-003/full
      network_id: all
      system_family: oxford_wildbird_network
      analysis_cluster: anchor
    guinea_baboons_sociopatterns:
      source_config: configs/EXP-20260814-004_baboon_validation.yaml
      source_results: results/EXP-20260814-004/full
      network_id: all
      system_family: guinea_baboons_sociopatterns
      analysis_cluster: anchor
    domestic_sheep_sirtrack:
      source_config: configs/EXP-20260815-009_sheep_precision_repaired.yaml
      source_results: results/EXP-20260815-009/full
      system_family: domestic_sheep_sirtrack
      analysis_cluster: network
    wytham_great_tits_divorce:
      source_config: configs/EXP-20260815-007_wytham_precision_repaired.yaml
      source_results: results/EXP-20260815-007/full
      system_family: linked_wytham_songbird_family
      analysis_cluster: anchor
    radolfzell_great_tits_ontogeny:
      source_config: configs/EXP-20260815-011_radolfzell_validation.yaml
      source_results: results/EXP-20260815-011/full
      network_id: radolfzell_longitudinal_population
      system_family: radolfzell_great_tits_ontogeny
      analysis_cluster: anchor
    experimental_wild_songbirds:
      source_config: configs/EXP-20260816-001_experimental_songbirds_validation.yaml
      source_results: results/EXP-20260816-001/full
      network_id: wytham_songbird_manipulation_population
      system_family: linked_wytham_songbird_family
      analysis_cluster: anchor

decision:
  detection: index case confirmed at anchor
  action_delay: zero
  response_budget_fraction: 0.05
  minimum_budget: 1
  residual_contact_multiplier: 0.25
  diversity_response:
    enabled: true
    shortlist_multiplier: 2.0
    primary_selector: greedily maximize weighted past-neighbor coverage within the top-history shortlist
    diagnostic_selector: greedily maximize weighted past-neighbor coverage over all eligible animals
  epidemic_models:
    - name: temporal_sir
    - name: temporal_seir_erlang
      latent_period_fraction_of_mean_infectious_period: 0.5
      latent_stages: 2
      infectious_stages: 3

evaluation:
  parameter_pool: informative
  parameter_selection_mode: median
  independent_replication_unit: animal_system_family
  bootstrap_replicates: 4000
  seed: 2026081808
  primary_estimand: family-equal avoided attack rate of the shortlist-diversified response relative to both top-history and the mean of eight equal-capacity random lists
  primary_gate:
    strong_repair: shortlist diversity has a positive interval and at least four of five positive family means versus both random and top-history in both epidemic models
    directional_repair: both means are positive with at least four of five positive family means in both epidemic models but at least one interval crosses zero
    unsupported: otherwise
  interpretation: a mechanism test of set redundancy under the ideal immediate-response boundary, not a claim that community or facility-location immunization is novel
  stop_rule: do not tune shortlist multiplier, objective, budget, disease parameters, mapping, family inclusion or gate after full outcomes

profiles:
  smoke:
    datasets: [oxford_wildbird_network, domestic_sheep_sirtrack]
    max_anchors_per_dataset: 1
    seeds_per_anchor: 1
    random_blocks: 1
    random_target_replicates: 2
    bootstrap_replicates: 100
    render_dpi: 110
  full:
    datasets:
      - oxford_wildbird_network
      - guinea_baboons_sociopatterns
      - domestic_sheep_sirtrack
      - wytham_great_tits_divorce
      - radolfzell_great_tits_ontogeny
      - experimental_wild_songbirds
    max_anchors_per_dataset: null
    seeds_per_anchor: 2
    random_blocks: 2
    random_target_replicates: 8
    render_dpi: 180

execution:
  resume: true

outputs:
  results_root: results
  report_root: reports/diversity_aware_response
