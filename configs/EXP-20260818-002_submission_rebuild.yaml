experiment:
  id: EXP-20260818-002
  name: clean_submission_evidence_rebuild
  evidence_level: reproducibility_audit
  description: Rebuild the complete manuscript-facing evidence chain in an empty isolated output tree and compare scientific artifacts with the frozen originals.

design:
  frozen_upstream_boundary: canonical-20260816-r01 and precision-audited model_ready_labels_v2
  clean_root: reproducibility/EXP-20260818-002
  numeric_atol: 1.0e-10
  numeric_rtol: 1.0e-10
  fail_fast: true
  compare_all_tabular_artifacts: true
  excluded_comparison_files:
    - resolved_config.yaml
    - run_manifest.json
    - source_artifact_hashes.csv
  frozen_static_inputs:
    - path: results/EXP-20260817-005/full/novelty_matrix.csv
      sha256: 8db79fc8fbcb5067ede89073e0337d4957b0c3a2fee1d02f08ebc2f14c58ddd4
      role: human-audited literature capability matrix; not generated by simulation
  reconciliation:
    # These are post-freeze diagnostics added by the current audited implementation.
    # Any unlisted artifact or figure remains a hard mismatch.
    additive_artifacts:
      - EXP-20260816-017/detection_timing_contrast_family_summary.csv
      - EXP-20260816-017/detection_timing_contrast_summary.csv
      - EXP-20260816-017/paired_detection_timing_contrasts.csv.gz
      - EXP-20260816-017/random_block_family_summary.csv
      - EXP-20260816-017/rewiring_mechanism_pairs.csv.gz
      - EXP-20260816-017/rewiring_mechanism_summary.csv
      - EXP-20260816-018/random_block_family_summary.csv
      - EXP-20260816-018/rewiring_mechanism_pairs.csv.gz
      - EXP-20260816-018/rewiring_mechanism_summary.csv
      - EXP-20260816-019/random_block_family_summary.csv
      - EXP-20260816-019/rewiring_mechanism_pairs.csv.gz
      - EXP-20260816-019/rewiring_mechanism_summary.csv
      - EXP-20260817-001/natural_attack_rate_family_summary.csv
      - EXP-20260817-001/natural_attack_rate_model_summary.csv
    additive_figures:
      - EXP-20260816-019/rewiring_mechanism_diagnostic.png
      - EXP-20260817-001/epidemic_model_attack_rate_support.png
    rendering_only_figures:
      - EXP-20260816-019/direct_contact_rewiring_family_heterogeneity.png
      - EXP-20260816-019/rewiring_family_heterogeneity.png
    provenance_artifacts:
      - EXP-20260817-009/source_audit_inventory.csv
    diagnostic_table_tolerances:
      EXP-20260816-020/rewiring_mechanism_summary.csv:
        cluster_spearman_gain_vs_rewired_difference: 0.005
    diagnostic_audit_tolerances:
      EXP-20260816-020:
        scientific_result.early_high_rewiring_cluster_spearman_range[0]: 0.005
    metadata_fill_columns:
      EXP-20260817-002/claim_evidence_cells.csv: &evidence_metadata
        - secondary_case_sensitivity
        - false_positive_rate
        - rewiring_fraction
        - rewiring_mode
      EXP-20260817-002/family_evidence_ledger.csv: *evidence_metadata
      EXP-20260817-002/negative_effect_cells.csv: *evidence_metadata
      EXP-20260817-002/policy_evidence_ledger.csv: *evidence_metadata

